name: CI

on:
  push:
    branches: [main, "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore ElectronicJova.slnx
      - name: Build
        run: dotnet build ElectronicJova.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test ElectronicJova.UnitTests/ElectronicJova.UnitTests.csproj --configuration Release --no-build
